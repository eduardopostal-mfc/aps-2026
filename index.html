<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APS 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Visual: cartaz de campanha de saúde. Fundo azul pontilhado, cartões "adesivo" de papel com contorno e sombra dura,
   amarelo para ação, verde/vermelho para certo/errado. Um único visual, de propósito (tela compartilhada e celular). */
:root{
  --blue:#0B3D91; --blue2:#1E63D0; --sky:#CFE3FF; --yellow:#FFD23F; --green:#12A45E; --red:#E8463A;
  --ink:#0E1A2B; --paper:#FFF8E8; --white:#FFFFFF; --muted:#52627A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--blue);background-image:radial-gradient(rgba(255,255,255,.1) 2px,transparent 2.6px);background-size:26px 26px;
  color:var(--ink);font-family:var(--body);font-weight:600;font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ol,ul{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
#app{min-height:100%;display:flex;flex-direction:column}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:1rem 1.15rem}
.btn{font-family:var(--display);font-weight:800;font-size:1.1rem;line-height:1.1;color:var(--ink);border:3px solid var(--ink);border-radius:14px;background:var(--white);
  padding:.55rem 1.1rem;box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--yellow)}
.btn.sm{font-size:.9rem;padding:.3rem .7rem;box-shadow:3px 3px 0 var(--ink);border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kick{font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
.mut{color:var(--muted)}
.chip{display:inline-block;font-family:var(--display);font-weight:800;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:0 .8rem;line-height:1.7}
.chip.y{background:var(--yellow)}
.stamp{display:inline-block;font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);
  border:3px solid var(--blue);border-radius:8px;padding:.15rem .6rem;transform:rotate(-1.5deg);background:var(--white);max-width:100%}

/* ---------- painel ---------- */
.host{flex:1;width:100%;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;padding-block:.9rem 14rem}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;color:var(--paper)}
.logo{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--yellow);line-height:1}
.top .grow,.ctrl .grow{flex:1}
.clock{font-family:var(--display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.4rem;align-items:start}
.stage.one{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:1rem;min-width:0}
.big{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.2vw,3.8rem);line-height:1;color:var(--paper);text-wrap:balance}
.big em{font-style:normal;color:var(--yellow)}
.lead{font-size:clamp(1.05rem,1.5vw,1.4rem);color:var(--paper);max-width:58ch}
.card .lead,.card .big{color:var(--ink)}
.host .kick{color:var(--yellow)}
.card .kick{color:var(--blue)}
.qcard{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,2.9vw,2.7rem);line-height:1.08;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.qrcard{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:1rem;align-items:center}
.qr{background:var(--white);border:3px solid var(--ink);border-radius:12px;padding:8px;aspect-ratio:1;display:grid;place-items:center}
.qr svg,.qr img{width:100%;height:auto;display:block}
.room{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.4vw,3rem);line-height:1}
.link{overflow-wrap:anywhere;font-size:.95rem}
.crowd{display:flex;flex-wrap:wrap;gap:.5rem}
.who{display:inline-flex;align-items:center;gap:.35rem;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:.05rem .7rem .05rem .3rem;font-family:var(--display);font-weight:800}
.who b{font-size:1.5rem;line-height:1.2}
.avs{display:flex;flex-wrap:wrap;gap:.2rem;font-size:1.7rem;line-height:1.1;min-height:2rem}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem}
.rules .card b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;margin-bottom:.25rem}
.rules .card span{font-size:2.4rem;line-height:1}
.ringw{display:flex;align-items:center;gap:1rem}
.ring{width:clamp(110px,13vw,170px);height:auto;flex:none}
.ring .bg{fill:var(--white);stroke:var(--ink);stroke-width:6}
.ring .fg{fill:none;stroke:var(--blue2);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring.hot .fg{stroke:var(--red)}
.ring text{font-family:var(--display);font-weight:800;font-size:38px;fill:var(--ink)}
.opts{display:flex;flex-direction:column;gap:.55rem;list-style:none;padding:0}
.opts li{display:flex;gap:.8rem;align-items:baseline;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:.5rem .8rem;font-size:clamp(1rem,1.35vw,1.3rem)}
.opts .k{font-family:var(--display);font-weight:800;background:var(--ink);color:var(--paper);border-radius:8px;padding:0 .5rem}
.opts li.right{background:var(--green);color:var(--white)}
.opts li.dim{opacity:.55}
.verdict{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,5vw,4.4rem);line-height:1;text-transform:uppercase;display:inline-block;padding:.1rem .8rem;
  border:5px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);transform:rotate(-3deg);color:var(--white)}
.verdict.t{background:var(--green)} .verdict.f{background:var(--red)}
.todo{border-left:8px solid var(--yellow);padding-left:.8rem}
.dist{display:flex;flex-direction:column;gap:.45rem}
.drow{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) 2.4rem;gap:.6rem;align-items:center;font-family:var(--display);font-weight:800}
.drow .b{height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}
.drow .b i{display:block;height:100%;background:var(--muted)}
.drow.ok .b i{background:var(--green)}
.quote{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,2.4vw,2.1rem);line-height:1.15}
.pface{font-size:clamp(3rem,6vw,5rem);line-height:1}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.side h3{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,2.3vw,2.1rem);line-height:1.05}
.side.a{background:var(--sky)} .side.b{background:var(--yellow)}
.side{display:flex;flex-direction:column;gap:.5rem}
.side .chip{align-self:flex-start}
.tugw{display:flex;flex-direction:column;gap:.2rem}
.tug{position:relative;height:46px;border:3px solid var(--ink);border-radius:999px;background:var(--yellow);overflow:visible}
.tug i{display:block;height:100%;background:var(--blue2);border-radius:999px 0 0 999px;transition:width 1s cubic-bezier(.2,.9,.2,1)}
.tug b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:2rem;transition:left 1s cubic-bezier(.2,.9,.2,1)}
.tugl{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800}
.swing{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,2.6vw,2.3rem);line-height:1.1}
.race{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4rem}
.lane{background:rgba(255,255,255,.12);border:3px dashed rgba(255,255,255,.5);border-radius:14px;padding:.4rem;min-height:9rem;display:flex;flex-direction:column;gap:.3rem;align-items:center}
.lane.fin{background:var(--yellow);border:3px solid var(--ink)}
.lane h4{margin:0;font-family:var(--display);font-weight:800;color:var(--paper);font-size:1.2rem}
.lane.fin h4{color:var(--ink)}
.lane .avs{justify-content:center}
.pairs{display:grid;gap:.5rem}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr);gap:.6rem;align-items:center}
.pair span{font-family:var(--display);font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:.25rem .6rem;line-height:1.15}
.pair .pt{background:var(--sky)} .pair .pm{background:var(--yellow)}
.pair small{grid-column:1/-1;color:var(--muted);font-size:.8rem;margin-top:-.3rem}
.lb{list-style:none;padding:0;display:flex;flex-direction:column;gap:.4rem}
.lb li{display:grid;grid-template-columns:2.4rem 2.2rem minmax(0,1fr) auto;gap:.5rem;align-items:center;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:.15rem .7rem;
  font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,1.6vw,1.45rem)}
.lb li:first-child{background:var(--yellow)}
.lb .av{font-size:1.6rem}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;align-items:end;max-width:44rem}
.pd{display:flex;flex-direction:column;align-items:center;gap:.2rem;color:var(--paper);font-family:var(--display);font-weight:800;text-align:center}
.pd .pav{font-size:clamp(2.6rem,5vw,4.2rem);line-height:1}
.pd .pn{font-size:clamp(1rem,1.6vw,1.5rem);line-height:1.05;overflow-wrap:anywhere}
.pd .pb{width:100%;border:3px solid var(--ink);border-radius:14px 14px 0 0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.3rem;
  box-shadow:6px 6px 0 var(--ink);font-size:clamp(1.4rem,2.4vw,2.2rem)}
.pd.p1 .pb{height:11rem;background:var(--yellow)} .pd.p2 .pb{height:8rem} .pd.p3 .pb{height:6rem}
.takes{padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}
.ctrl{position:fixed;left:0;right:0;bottom:138px;z-index:16;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;color:var(--paper);background:var(--blue);border-top:3px solid var(--ink);
  padding:.45rem max(16px,env(safe-area-inset-right,0px)) .55rem max(16px,env(safe-area-inset-left,0px))}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:var(--yellow)}
.dots i.ph{border-radius:2px}

/* ---------- celular ---------- */
.player{flex:1;width:100%;max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:.8rem;padding-block:.8rem 5.4rem}
.phead{display:flex;align-items:center;gap:.6rem;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:.15rem .9rem .15rem .4rem;box-shadow:4px 4px 0 var(--ink);font-family:var(--display);font-weight:800}
.phead .av{font-size:1.7rem;line-height:1.2}
.phead .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .sc{background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:0 .7rem;font-variant-numeric:tabular-nums}
.net{font-size:.75rem;color:var(--paper);text-align:center;font-weight:800}
.pc{display:flex;flex-direction:column;gap:.8rem}
.pc h1{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--blue)}
.pc h2{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.1;text-wrap:balance}
.inp{border:3px solid var(--ink);border-radius:14px;padding:.6rem .8rem;background:var(--white);width:100%;font-size:1.15rem;font-weight:800}
.avpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem}
.avpick button{font-size:1.7rem;line-height:1.3;border:3px solid transparent;border-radius:12px;background:var(--white)}
.avpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.tbar{height:12px;border:3px solid var(--ink);border-radius:999px;background:var(--white);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--blue2);transition:width .25s linear}
.vf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.vf button{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--white);border:3px solid var(--ink);border-radius:16px;padding:1.1rem .3rem;box-shadow:4px 4px 0 var(--ink)}
.vf .v{background:var(--green)} .vf .f{background:var(--red)}
.vf button[aria-pressed="true"],.opt[aria-pressed="true"],.bet[aria-pressed="true"]{transform:translate(3px,3px);box-shadow:0 0 0 4px var(--yellow),1px 1px 0 var(--ink)}
.opt{display:flex;gap:.6rem;align-items:baseline;text-align:left;width:100%;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:.65rem .8rem;box-shadow:4px 4px 0 var(--ink)}
.opt .k{font-family:var(--display);font-weight:800;background:var(--ink);color:var(--paper);border-radius:8px;padding:0 .45rem}
.bets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;justify-items:center}
.bet{width:4.2rem;height:4.2rem;border-radius:50%;border:4px dashed var(--ink);background:var(--white);font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;box-shadow:4px 4px 0 var(--ink)}
.bet small{display:block;font-family:var(--body);font-size:.62rem;font-weight:800;color:var(--muted)}
.bigic{font-size:4rem;line-height:1;text-align:center}
.resbig{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;text-align:center}
.resbig.ok{color:var(--green)} .resbig.no{color:var(--red)}
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.mc{aspect-ratio:1/.92;border:0;padding:0;background:none;perspective:700px}
.mc .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .32s}
.mc.open .in,.mc.hit .in{transform:rotateY(180deg)}
.mc .bk,.mc .fr{position:absolute;inset:0;display:grid;place-items:center;border:3px solid var(--ink);border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:3px 3px 0 var(--ink)}
.mc .bk{background:var(--blue2);color:var(--yellow);font-family:var(--display);font-weight:800;font-size:2rem}
.mc .fr{transform:rotateY(180deg);font-family:var(--display);font-weight:800;font-size:.86rem;line-height:1.08;padding:.25rem;text-align:center;overflow-wrap:anywhere}
.mc.s-t .fr{background:var(--sky)} .mc.s-m .fr{background:var(--yellow)}
.mc.hit .fr{background:var(--green);color:var(--white)}
.toast{min-height:2.6rem;font-size:.92rem;text-align:center}
.react{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:.4rem;background:var(--ink);
  padding:.45rem max(12px,env(safe-area-inset-right,0px)) calc(.45rem + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.react button{font-size:1.6rem;line-height:1;width:2.9rem;height:2.9rem;border-radius:50%;border:3px solid var(--paper);background:var(--blue)}
.react button:active{transform:scale(.88)}
.react button[aria-pressed="true"]{background:var(--yellow)}

/* ---------- pista: a plateia viva no rodapé do painel ---------- */
#track{position:fixed;left:0;right:0;bottom:0;height:138px;z-index:15;pointer-events:none;display:none;
  background:linear-gradient(to top,rgba(14,26,43,.96),rgba(14,26,43,.82));border-top:3px solid var(--ink)}
#track.on{display:block}
#track::before{content:"";position:absolute;left:3%;right:6%;top:50%;border-top:3px dashed rgba(255,255,255,.3)}
#track::after{content:"🏁";position:absolute;right:1.4%;top:50%;transform:translateY(-50%);font-size:1.9rem}
.tk{position:absolute;transform:translate(-50%,-50%);width:5rem;text-align:center;transition:left 1.1s cubic-bezier(.2,.9,.2,1),top .4s}
.tk .a{position:relative;display:inline-grid;place-items:center;width:2.7rem;height:2.7rem;border-radius:50%;background:var(--paper);border:3px solid var(--ink);font-size:1.5rem;line-height:1}
.tk .n{display:block;font-family:var(--display);font-weight:800;font-size:.72rem;line-height:1.15;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .bd{position:absolute;right:-.55rem;bottom:-.35rem;font-size:1.05rem;line-height:1}
.tk .bb{position:absolute;left:50%;bottom:108%;margin-left:-.9rem;font-size:1.8rem;line-height:1;animation:pop .3s both}
.tk.think .a{animation:bob 1s ease-in-out infinite}
.tk.done .a{background:var(--yellow)}
.tk.ok .a{background:var(--green)} .tk.no .a{background:var(--red)}
.tk.off{opacity:.45}
#track.dense .n{display:none}
#toasts{position:fixed;right:1rem;top:5.6rem;z-index:22;display:flex;flex-direction:column;gap:.4rem;align-items:flex-end;pointer-events:none}
.ts{background:var(--yellow);border:3px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);font-family:var(--display);font-weight:800;padding:.05rem .9rem;animation:tin .3s both}
#curtain{position:fixed;inset:0;z-index:25;background:rgba(11,61,145,.95);display:grid;place-items:center;text-align:center;padding:1rem}
#curtain b{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,8vw,6.5rem);line-height:1;color:var(--yellow);animation:pulse .45s ease-in-out infinite alternate}
.btn[aria-pressed="true"]{background:var(--yellow)}
.aw{font-size:1.8rem;line-height:1}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes tin{from{transform:translateX(120%)}}
@keyframes pulse{from{transform:scale(.94)}to{transform:scale(1.06)}}

/* ---------- Capi, a apresentadora ---------- */
#capi{position:fixed;left:0;bottom:0;width:34%;height:138px;z-index:17;display:none;align-items:center;gap:.5rem;pointer-events:none;
  background:linear-gradient(to top,rgba(14,26,43,.96),rgba(14,26,43,.82));border-top:3px solid var(--ink);
  padding:.3rem .5rem .3rem max(10px,env(safe-area-inset-left,0px))}
#capi.on{display:flex}
#capi svg{height:122px;width:auto;flex:none}
.bub{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:.35rem .65rem;font-family:var(--display);font-weight:800;
  font-size:clamp(.82rem,1.2vw,1.1rem);line-height:1.15;max-height:122px;overflow:hidden;opacity:0;transition:opacity .25s;min-width:0}
.bub.on{opacity:1}
.cp-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.cp-mouth{transform-box:fill-box;transform-origin:center top}
#capi.talk .cp-mouth{animation:talk .2s ease-in-out infinite alternate}
#capi.happy svg{animation:hop .5s ease-out 2}
#capi.sad svg{transform:rotate(-7deg)}
#track{left:34%}
#wheel{position:fixed;inset:0;z-index:24;background:rgba(11,61,145,.97);display:grid;place-items:center;padding:1rem;overflow:auto}
.wbox{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center}
.wbox .kick{color:var(--yellow)}
#wcv{width:min(52vh,440px);height:auto;border-radius:50%;box-shadow:8px 8px 0 var(--ink)}
.wptr{font-size:2.4rem;line-height:.7;color:var(--yellow)}
.rx{background:var(--white);background-image:repeating-linear-gradient(transparent 0 2.2rem,rgba(11,61,145,.14) 2.2rem 2.28rem)}
.rxp{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,2vw,1.8rem);line-height:1.1}
.rxl{list-style:none;padding:0;margin:.5rem 0;display:flex;flex-direction:column;gap:.4rem;font-size:clamp(1rem,1.5vw,1.4rem)}
.rxl li{display:flex;gap:.7rem;align-items:baseline;border-radius:10px;padding:.15rem .4rem}
.rxl .k{font-family:var(--display);font-weight:800;background:var(--ink);color:var(--paper);border-radius:8px;padding:0 .5rem}
.rxl li.bad{background:var(--red);color:var(--white);text-decoration:line-through}
.rxl li.good{opacity:.65}
.rxs{font-family:var(--display);font-weight:800;color:var(--red);font-size:clamp(1.1rem,1.8vw,1.6rem)}

}
function enter(s){

    H.memDone[s.r]=true;var best=null;
    pids().forEach(function(k){var m=H.players[k].m[s.r];if(m&&m.d&&(best==null||m.ms<H.players[best].m[s.r].ms))best=k;});
    H.memWin[s.r]=best;
  }
}

function netState(){

function tickHost(){
  if(route()!=="painel")return;
  var c=$("hclock");if(c)c.textContent=H.start?mmss((Date.now()-H.start)/1000):"00:00";
  var rp=$("ringp"),rt=$("ringt"),rg=$("ring");
  if(rp&&rt){
    if(!H.timer){rt.textContent="–";rp.setAttribute("stroke-dashoffset","0");return;}
    var l=(H.timer.end-Date.now())/1000,sec=Math.max(0,Math.ceil(l));
    rt.textContent=sec;rp.setAttribute("stroke-dashoffset",String(289*(1-Math.max(0,Math.min(1,l/H.timer.total)))));
    if(rg)rg.setAttribute("class","ring"+(l<=5?" hot":""));
    if(sec!==HTICK){if(HTICK!==-1&&sec<=5&&sec>0)sfx("tick");
      if(HTICK>0&&sec===0){sfx("bad");var st=STEPS[H.idx];
        if(H.auto&&!AUTOT&&(st.t==="q"||st.t==="cq"||st.t==="mem")){var at=H.idx;AUTOT=setTimeout(function(){AUTOT=null;if(H.idx===at)go(1);},1800);}}
      HTICK=sec;}
  }
}
