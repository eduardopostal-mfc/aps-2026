<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>APS 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: quadro de sala de equipe da UBS. Painel = palco em duas colunas (enunciado à esquerda, código/tempo/gabarito à direita)
   com faixa de controle discreta embaixo; celular = uma coluna, um cartão por vez. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --sunk:#E1E8ED; --ink:#0F2233; --muted:#566878; --line:#C9D4DC;
  --accent:#0A6C8A; --accent-ink:#FFFFFF; --ok:#17794F; --no:#B63F2A; --bet:#B47A00; --stamp:#1F4E79;
  --qr-bg:#FFFFFF; --qr-fg:#000000;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1620; --surface:#122332; --sunk:#0E1C29; --ink:#E9F0F5; --muted:#9AB0C1; --line:#274052;
    --accent:#5CC0DE; --accent-ink:#06202B; --ok:#4CC38A; --no:#F0806A; --bet:#F2B93B; --stamp:#9CC7F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1620; --surface:#122332; --sunk:#0E1C29; --ink:#E9F0F5; --muted:#9AB0C1; --line:#274052;
  --accent:#5CC0DE; --accent-ink:#06202B; --ok:#4CC38A; --no:#F0806A; --bet:#F2B93B; --stamp:#9CC7F0;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.6rem 1rem;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:.35rem .7rem;font-size:.85rem;font-weight:500}

/* carimbo: a citação do documento oficial */
.stamp{display:inline-block;border:2px solid var(--stamp);outline:1px solid var(--stamp);outline-offset:2px;color:var(--stamp);
  font-family:var(--mono);font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;padding:.45rem .7rem;border-radius:4px;
  transform:rotate(-1.2deg);max-width:100%}
.stamp + .stamp{margin-top:.7rem}

/* ---------- painel ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.host,.player{flex:1;width:100%}
.host{display:flex;flex-direction:column;gap:1rem;padding-block:1rem;max-width:1500px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.25rem;border-bottom:1px solid var(--line);padding-bottom:.6rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.topbar .grow{flex:1}
.clock{font-family:var(--mono);font-size:1rem}
.clock b{font-weight:600}
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:1.5rem;align-items:start}
.stage.one{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:1rem;min-width:0}
.big{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,3.3vw,3.1rem);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.mid{font-family:var(--display);font-weight:500;font-size:clamp(1.2rem,2vw,1.8rem);line-height:1.2;text-wrap:balance}
.lead{font-size:clamp(1rem,1.35vw,1.3rem);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem}
.codebox{text-align:center}
.codebox .code{font-family:var(--mono);font-weight:600;font-size:clamp(3.5rem,8vw,6.5rem);line-height:1;letter-spacing:.08em;color:var(--accent)}
.timer{font-family:var(--mono);font-weight:600;font-size:clamp(2.2rem,4.5vw,3.6rem);line-height:1;font-variant-numeric:tabular-nums}
.timer.end{color:var(--no)}
.trow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem}
.opts{display:flex;flex-direction:column;gap:.55rem;list-style:none;margin:0;padding:0}
.opts li{display:flex;gap:.8rem;align-items:baseline;border:1px solid var(--line);border-radius:var(--r);padding:.6rem .8rem;background:var(--surface);
  font-size:clamp(1rem,1.3vw,1.25rem)}
.opts .k{font-family:var(--mono);font-weight:600;color:var(--muted)}
.opts li.right{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.opts li.right .k{color:var(--ok)}
.opts li.dim{opacity:.5}
.verdict{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.6rem);line-height:1.05}
.verdict.t{color:var(--ok)} .verdict.f{color:var(--no)}
.todo{border-left:4px solid var(--bet);padding:.2rem 0 .2rem .8rem}
.ficha{font-family:var(--mono);font-size:.95rem;color:var(--muted)}
.quote{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,2.4vw,2.2rem);line-height:1.2;text-wrap:balance}
.quote::before{content:"\201C"} .quote::after{content:"\201D"}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;list-style:none;margin:0;padding:0}
.rules li{border-top:3px solid var(--accent);padding-top:.6rem}
.rules b{display:block;font-family:var(--display);font-size:1.25rem;margin-bottom:.2rem}
.bets{display:flex;gap:.5rem;flex-wrap:wrap}
.betchip{font-family:var(--mono);font-weight:600;border:2px solid var(--bet);color:var(--bet);border-radius:999px;padding:.15rem .7rem}
.join{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:1rem;align-items:center}
.qr{background:var(--qr-bg);color:var(--qr-fg);border-radius:8px;padding:8px;aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.qr svg,.qr img{width:100%;height:auto;display:block}
.linktext{font-family:var(--mono);font-size:.95rem;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .65rem;min-width:0;width:100%}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.side{border:1px solid var(--line);border-radius:var(--r);padding:1rem;background:var(--surface);display:flex;flex-direction:column;gap:.7rem}
.side .tag{font-family:var(--mono);font-weight:600;font-size:1rem}
.side.a .tag{color:var(--accent)} .side.b .tag{color:var(--bet)}
.side h3{font-family:var(--display);font-size:clamp(1.3rem,2.2vw,2rem);line-height:1.1}
.votes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.bar{height:26px;border-radius:6px;background:var(--bet);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--accent)}
.barlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.85rem;margin-top:.2rem}
.swing{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,2.3vw,2rem)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.board li{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto auto;gap:.7rem;align-items:center;border-bottom:1px solid var(--line);padding:.35rem 0;
  font-size:clamp(1rem,1.5vw,1.4rem)}
.board .pos{font-family:var(--mono);color:var(--muted)}
.board .pts{font-family:var(--mono);font-weight:600}
.board .chk{font-family:var(--mono);font-size:.8rem}
.board .chk.ok{color:var(--ok)} .board .chk.bad{color:var(--no)}
.addrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:.5rem;align-items:end}
.takes{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.45rem;font-size:clamp(1rem,1.35vw,1.25rem)}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;border-top:1px solid var(--line);padding-top:.6rem}
.ctrl .grow{flex:1}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.ph{border-radius:2px;background:var(--muted)}
.dots i.ph.on{background:var(--accent)}

/* ---------- celular ---------- */
.player{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem;padding-block:1rem}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:.5rem}
.phead .pts{font-family:var(--mono);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem;display:flex;flex-direction:column;gap:.9rem}
.card h1{font-family:var(--display);font-size:2rem;line-height:1.05;letter-spacing:-.02em}
.card h2{font-family:var(--display);font-size:1.3rem;line-height:1.15;text-wrap:balance}
.codein{font-family:var(--mono);font-weight:600;font-size:2.4rem;letter-spacing:.3em;text-align:center;border:2px solid var(--line);border-radius:var(--r);
  padding:.5rem;background:var(--sunk);width:100%}
.namein{border:2px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;background:var(--sunk);width:100%;font-size:1.1rem}
.err{color:var(--no);font-weight:500}
.choice{display:flex;gap:.7rem;align-items:baseline;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.8rem .9rem;width:100%;font-size:1.02rem}
.choice .k{font-family:var(--mono);font-weight:600;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--sunk)}
.choice[aria-pressed="true"] .k{color:var(--accent)}
.vf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.vf .choice{justify-content:center;font-family:var(--display);font-weight:700;font-size:1.25rem;padding:1.1rem .5rem}
.betrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.bet{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.55rem .3rem;font-family:var(--mono);font-weight:600;font-size:1.15rem}
.bet small{display:block;font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--muted)}
.bet[aria-pressed="true"]{border-color:var(--bet);color:var(--bet);background:var(--sunk)}
.tbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.res{border-left:4px solid var(--line);padding:.1rem 0 .1rem .8rem;display:flex;flex-direction:column;gap:.25rem}
.res.ok{border-color:var(--ok)} .res.no{border-color:var(--no)}
.res .delta{font-family:var(--mono);font-weight:600}
.res.ok .delta{color:var(--ok)} .res.no .delta{color:var(--no)}
.final{font-family:var(--mono);font-weight:600;font-size:1.2rem;background:var(--sunk);border:2px dashed var(--line);border-radius:var(--r);padding:.8rem;overflow-wrap:anywhere;user-select:all}
.bigscore{font-family:var(--display);font-weight:700;font-size:4rem;line-height:1}
.foot{margin-top:auto;font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.foot a{color:inherit}

.net{font-family:var(--mono);font-size:.72rem;font-weight:500;margin-left:.4rem}
.net.on{color:var(--ok)} .net.off{color:var(--bet)}
.codebox.mini .code{font-size:clamp(1.8rem,3vw,2.6rem)}
.dist{display:flex;flex-direction:column;gap:.4rem;margin-top:.4rem}
.drow{display:grid;grid-template-columns:minmax(0,7rem) minmax(0,1fr) 2.2rem;gap:.6rem;align-items:center}
.drow.ok{color:var(--ok);font-weight:600}
.bar2{height:14px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--muted)}
.drow.ok .bar2 i{background:var(--ok)}

@media (max-width:820px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .sides,.votes{grid-template-columns:minmax(0,1fr)}
  .join{grid-template-columns:minmax(0,8rem) minmax(0,1fr)}
  .addrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion: no-preference){
  .tbar i{transition:width .25s linear}
  .bar i{transition:width .4s ease}
}
</style>

/* ================= UTIL ================= */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
function chk(name,score){var n=norm(name),h=977+(Number(score)+50)*131;for(var i=0;i<n.length;i++){h=(h*31+n.charCodeAt(i)*(i+7))%46656;}h=h%1296;var s=h.toString(36).toUpperCase();return s.length<2?"0"+s:s;}
function mmss(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function points(item,a){if(!a||a.choice==null)return 0;return a.choice===item.ans?a.bet:-(a.bet-1);}
function letter(i){return "ABCD".charAt(i);}
function ansLabel(item,c){if(c==null)return "Sem resposta";return item.kind==="vf"?(c?"Verdadeiro":"Falso"):letter(c)+". "+item.opts[c];}

var PN={peer:null,conn:null,ok:false,live:null,you:null,retry:null,key:""};
function psend(o){try{if(PN.conn&&PN.conn.open){o.pid=P.pid;PN.conn.send(o);}}catch(e){}}
function phello(){psend({t:"hello",name:P.name,ans:P.ans,votes:P.votes});}
function pretry(ms){if(PN.retry)return;PN.retry=setTimeout(function(){PN.retry=null;pconnect();},ms||3000);}
function pstop(){try{if(PN.peer)PN.peer.destroy();}catch(e){}PN.peer=null;PN.conn=null;PN.ok=false;PN.live=null;PN.you=null;PN.key="";}
function pconnect(){
  if(!LIVE||!P.room||!P.name)return;
  if(!PN.peer||PN.peer.destroyed){PN.peer=null;playerNet();return;}
  if(PN.conn&&PN.conn.open)return;
  if(PN.peer.disconnected){try{PN.peer.reconnect();}catch(e){}pretry(3000);return;}
  var c;try{c=PN.peer.connect(peerId(P.room),{reliable:true});}catch(e){pretry(3000);return;}
  PN.conn=c;
  c.on("open",function(){PN.ok=true;phello();if(route()==="jogar")render();});
  c.on("data",playerMsg);
  c.on("close",function(){if(PN.conn===c){PN.ok=false;PN.conn=null;if(route()==="jogar")render();pretry(2500);}});
  c.on("error",function(){if(PN.conn===c){PN.ok=false;PN.conn=null;pretry(3000);}});
}
function playerNet(){
  if(!LIVE||!P.room||!P.name||PN.peer)return;
  var p;try{p=new Peer();}catch(e){return;}
  PN.peer=p;
  p.on("open",pconnect);
  p.on("disconnected",function(){pretry(2500);});
  p.on("error",function(){if(!(PN.conn&&PN.conn.open)){PN.ok=false;PN.conn=null;pretry(3500);}});
}
function playerMsg(d){
  if(!d)return;
  if(d.t==="you"){var ch=!PN.you||PN.you.rank!==d.rank||PN.you.of!==d.of;PN.you=d;if(ch&&route()==="jogar")render();return;}
  if(d.t==="reset"){
    P.ans={};P.rev={};P.votes={};P.cur=null;P.view="wait";PN.you=null;PN.live=null;PN.key="";
    if(d.room&&d.room!==P.room){P.room=d.room;psave();try{history.replaceState(null,"",location.pathname+"?sala="+d.room+location.hash);}catch(e){}pstop();playerNet();}else{psave();phello();}
    if(route()==="jogar")render();return;
  }
  if(d.t!=="state")return;
  var id=d.id,key=[d.view,d.id,d.d,d.r,d.a1,d.a2,d.title,JSON.stringify(d.top||"")].join("|"),same=key===PN.key;
  PN.live=d;PN.key=key;
  if(d.view==="q"&&STEP[id]&&!P.ans[id]){
    var fresh=!(P.view==="question"&&P.cur&&P.cur.id===id);
    if(fresh)startQ(id);
    P.cur.at=Date.now()-(STEP[id].secs-(d.left==null?STEP[id].secs:d.left))*1000;
    if(!fresh)return;
  } else {
    if(same&&(P.view==="live"||P.view==="locked"))return;
    P.cur=null;
    if(d.view==="rev"&&STEP[id]){if(!P.ans[id])P.ans[id]={choice:null,bet:0};P.rev[id]=true;}
    if(d.view==="board"||d.view==="final"){Object.keys(P.ans).forEach(function(k){P.rev[k]=true;});}
    P.view="live";
  }
  psave();if(route()==="jogar")render();
}

function openCode(c){
  P.err="";
  if(c===FINAL_CODE){P.queue=pending();P.queue.forEach(function(id){P.rev[id]=true;});P.next="final";P.view=P.queue.length?"results":"final";psave();render();return;}
  var it=BYCODE[c];
  if(!it){P.err="Código não encontrado. Confira os dois dígitos na tela.";render();return;}
  if(P.ans[it.id]){P.err="Você já respondeu esta rodada. Aguarde o próximo código.";render();return;}
  P.queue=pending();P.queue.forEach(function(id){P.rev[id]=true;});
  P.next=it.id;
  if(P.queue.length){P.view="results";}else{startQ(it.id);}
  psave();render();
}
function startQ(id){P.cur={id:id,at:Date.now()};P.sel=null;P.bet=1;P.view="question";}
function lockQ(timeout){
  if(!P.cur)return;
  var id=P.cur.id;
  P.ans[id]=(P.sel==null)?{choice:null,bet:0}:{choice:P.sel,bet:P.bet};
  P.cur=null;P.view="locked";P.last=id;P.timeout=!!timeout;psave();
  if(P.ans[id].choice!=null)psend({t:"ans",id:id,c:P.ans[id].choice,b:P.ans[id].bet});
  render();
}

function planOf(s){if(s.t==="capa"||s.t==="regras")return 0;if(s.t==="final")return 4;if(s.t==="placar")return 2;if(s.t==="fase")return s.n;if(s.t==="q")return 1;if(s.t==="caso")return 2;return 3;}

var H=hotData.host||load("plantao26_host")||{idx:0,start:null,link:"",board:[],duel:{},timer:null};
if(!H.players)H.players={};if(!H.done)H.done={};if(!H.room)H.room=newRoom();
function defaultLink(){return STANDALONE&&/^https?:/.test(location.protocol)?location.origin+location.pathname+(LIVE?"?sala="+H.room:""):"";}
if(/claude\.ai\/artifact\//.test(H.link||""))H.link=""; /* endereço privado do Claude não serve aos médicos */
if(!H.link||STANDALONE)H.link=defaultLink()||H.link;
function hsave(){save("plantao26_host",H);}
function markDone(s){if(s.t==="q"&&s.rev)H.done[F1[s.i].id]=true;if(s.t==="caso"&&s.st==="rev")H.done[F2[s.i].id]=true;}
function go(d){
  var n=Math.min(STEPS.length-1,Math.max(0,H.idx+d));if(n===H.idx)return;
  H.idx=n;var s=STEPS[n];markDone(s);H.timer=s.secs?{end:Date.now()+s.secs*1000,label:""}:null;hsave();render();
}

/* ---------- painel: conexão ao vivo com os celulares ---------- */
var HN={peer:null,ok:false,conns:{},saveT:null};
function hsaveSoon(){if(HN.saveT)return;HN.saveT=setTimeout(function(){HN.saveT=null;hsave();},800);}
function nPlayers(){return Object.keys(H.players).filter(function(k){return H.players[k].n;}).length;}
function answered(id){return Object.keys(H.players).filter(function(k){var a=H.players[k].a[id];return a&&a.c!=null;}).length;}
function scoreOf(pl){var t=0;Object.keys(H.done).forEach(function(id){var a=pl.a[id];if(a&&STEP[id])t+=points(STEP[id],{choice:a.c,bet:a.b});});return t;}
function ranking(){
  var r=Object.keys(H.players).filter(function(k){return H.players[k].n;}).map(function(k){return {n:H.players[k].n,s:scoreOf(H.players[k]),pid:k};});
  H.board.forEach(function(e){r.push({n:e.n,s:e.s,c:e.c,manual:true});});
  r.sort(function(x,y){return y.s-x.s;});return r;
}
function tally(did){
  var o={n1:0,a1:0,n2:0,a2:0};
  Object.keys(H.players).forEach(function(k){var v=H.players[k].v[did];if(!v)return;if(v[1]){o.n1++;if(v[1]==="a")o.a1++;}if(v[2]){o.n2++;if(v[2]==="a")o.a2++;}});
  o.p1=o.n1?Math.round(o.a1/o.n1*100):null;o.p2=o.n2?Math.round(o.a2/o.n2*100):null;return o;
}
function netState(){
  var s=STEPS[H.idx],o={t:"state",room:H.room};
  if(s.t==="capa"){o.view="wait";o.title="Você está no jogo";o.sub="Aguarde o início e fique de olho na tela compartilhada.";}
  else if(s.t==="regras"){o.view="wait";o.title="Regras";o.sub="Responda e aposte 1, 2 ou 3 pontos. Acertou: ganha a aposta. Errou: perde a aposta menos 1.";}
  else if(s.t==="fase"){o.view="wait";o.title=["","Fase 1: mudou ou não mudou?","Fase 2: consulta ao vivo","Fase 3: duelo das diretrizes"][s.n];o.sub="A rodada abre sozinha aqui.";}
  else if(s.t==="q"){o.id=F1[s.i].id;o.view=s.rev?"rev":"q";}
  else if(s.t==="caso"){var c=F2[s.i];o.id=c.id;if(s.st==="ficha"){o.view="wait";o.title=c.nome;o.sub="Pergunte ao paciente pelo chat da sala. A pergunta de conduta abre em seguida.";}else{o.view=s.st==="rev"?"rev":"q";}}
  else if(s.t==="duelo"){var d=F3[s.i];o.d=d.id;if(s.st==="fecho"){var t=tally(d.id);o.view="voteres";o.a1=t.p1;o.a2=t.p2;}else{o.view="vote";o.r=s.st==="cena"?1:2;}}
  else{o.view=s.t==="final"?"final":"board";o.top=ranking().slice(0,5).map(function(e){return {n:e.n,s:e.s};});}
  if(o.view==="q"&&H.timer)o.left=Math.max(0,Math.round((H.timer.end-Date.now())/1000));
  return o;
}
function bcast(){
  if(!HN.peer)return;var st=netState(),rk=null;
  if(st.view==="board"||st.view==="final"||st.view==="rev"){rk=ranking().filter(function(e){return e.pid;});}
  Object.keys(HN.conns).forEach(function(k){var c=HN.conns[k];if(!c||!c.open)return;
    try{c.send(st);if(rk){for(var i=0;i<rk.length;i++){if(rk[i].pid===k){c.send({t:"you",rank:i+1,of:rk.length,score:rk[i].s});break;}}}}catch(e){}});
}
function hostMsg(c,d){
  if(!d||!d.pid)return;var pid=String(d.pid).slice(0,24);
  var pl=H.players[pid]||(H.players[pid]={n:"",a:{},v:{}});
  HN.conns[pid]=c;c._pid=pid;var s=STEPS[H.idx];
  if(d.t==="hello"){
    pl.n=String(d.name||"").replace(/\s+/g," ").trim().slice(0,18);
    if(d.ans)Object.keys(d.ans).forEach(function(id){var a=d.ans[id];if(STEP[id]&&!pl.a[id]&&a&&a.choice!=null)pl.a[id]={c:a.choice,b:Math.max(1,Math.min(3,Number(a.bet)||1))};});
    try{c.send(netState());}catch(e){}
  } else if(d.t==="ans"){
    if(STEP[d.id]&&!H.done[d.id]&&!pl.a[d.id]&&d.c!=null)pl.a[d.id]={c:d.c,b:Math.max(1,Math.min(3,Number(d.b)||1))};
  } else if(d.t==="vote"){
    if(s.t==="duelo"&&F3[s.i].id===d.d&&(d.s==="a"||d.s==="b")){var r=s.st==="cena"?1:(s.st==="fala"?2:0);if(r&&d.r===r){(pl.v[d.d]||(pl.v[d.d]={}))[r]=d.s;}}
  }
  hsaveSoon();liveUpdate();
}
function hostNet(){
  if(!LIVE||HN.peer)return;
  var p;try{p=new Peer(peerId(H.room));}catch(e){return;}
  HN.peer=p;
  p.on("open",function(){HN.ok=true;liveUpdate();});
  p.on("connection",function(c){
    c.on("data",function(d){hostMsg(c,d);});
    c.on("close",function(){if(c._pid&&HN.conns[c._pid]===c)delete HN.conns[c._pid];liveUpdate();});
  });
  p.on("disconnected",function(){HN.ok=false;liveUpdate();setTimeout(function(){try{if(!p.destroyed)p.reconnect();}catch(e){}},2000);});
  p.on("error",function(e){if(e&&e.type==="unavailable-id"){HN.ok=false;try{p.destroy();}catch(x){}HN.peer=null;setTimeout(hostNet,3000);}liveUpdate();});
}
function netLabel(){return !LIVE?"":(HN.ok?"Sala "+H.room+" · "+nPlayers()+" no jogo":"Sala "+H.room+" · conectando…");}
function playersChips(){var ks=Object.keys(H.players).filter(function(k){return H.players[k].n;});if(!ks.length)return '<span class="muted">Ninguém entrou ainda.</span>';return ks.map(function(k){return '<span class="betchip">'+esc(H.players[k].n)+'</span>';}).join("");}
function countBox(id){return LIVE?'<p class="lead mono" id="hcount">'+answered(id)+" de "+nPlayers()+' responderam</p>':"";}
function distHtml(id){
  var it=STEP[id],n=0,cnt={},b3=0,b3w=0;
  Object.keys(H.players).forEach(function(k){var a=H.players[k].a[id];if(!a||a.c==null)return;n++;var key=String(a.c);cnt[key]=(cnt[key]||0)+1;if(a.b===3){b3++;if(a.c!==it.ans)b3w++;}});
  if(!n)return "";
  var parts=it.kind==="vf"?[["true","Verdadeiro"],["false","Falso"]]:it.opts.map(function(o,i){return [String(i),"Opção "+letter(i)];});
  return '<div class="panel"><p class="eyebrow">Como a sala respondeu · '+n+' respostas</p><div class="dist">'+parts.map(function(p){var v=cnt[p[0]]||0;return '<div class="drow'+(String(it.ans)===p[0]?" ok":"")+'"><span>'+p[1]+'</span><div class="bar2"><i style="width:'+Math.round(v/n*100)+'%"></i></div><span class="mono">'+v+'</span></div>';}).join("")+'</div>'+
    (b3?'<p class="muted">'+b3+(b3===1?" apostou":" apostaram")+' 3 pontos'+(b3w?"; "+b3w+(b3w===1?" errou":" erraram"):"; sem erros")+'.</p>':'')+'</div>';
}
function liveUpdate(){
  if(route()!=="painel")return;var s=STEPS[H.idx],e;
  if((e=document.getElementById("hnet")))e.textContent=netLabel();
  if((e=document.getElementById("hcount"))){var id=s.t==="q"?F1[s.i].id:(s.t==="caso"?F2[s.i].id:null);if(id)e.textContent=answered(id)+" de "+nPlayers()+" responderam";}
  if((e=document.getElementById("hplayers")))e.innerHTML=playersChips();
  if((e=document.getElementById("duelres"))&&s.t==="duelo")e.innerHTML=duelResult(s.i,s.st);
  if((e=document.getElementById("board")))e.innerHTML=boardHtml(s.t==="final"?8:6);
}
function setTimer(secs,label){H.timer={end:Date.now()+secs*1000,label:label||""};hsave();render();}
function stamps(docs){return docs.map(function(d){return '<div><span class="stamp">'+esc(d)+'</span></div>';}).join("");}
function timerBox(){
  return '<div class="panel"><div class="trow"><div><p class="eyebrow" id="htlabel">'+esc((H.timer&&H.timer.label)||"Tempo")+'</p><div class="timer" id="htimer">--:--</div></div>'+
    '<div class="bets"><button class="btn small" data-act="t+">+15 s</button><button class="btn small" data-act="t0">Reiniciar</button></div></div></div>';
}
function codeBox(code){
  return LIVE?'<div class="panel codebox mini"><p class="eyebrow">Código reserva, para o celular que não conectou</p><div class="code">'+esc(code)+'</div></div>':
    '<div class="panel codebox"><p class="eyebrow">Código da rodada</p><div class="code">'+esc(code)+'</div><p class="muted">Digite no celular para abrir</p></div>';
}
function boardHtml(limit){
  var b=ranking();
  if(!b.length)return '<p class="muted">'+(LIVE?"O placar aparece aqui quando os médicos entrarem no jogo.":"O placar aparece aqui quando vocês lançarem as pontuações enviadas no chat.")+'</p>';
  var h='<ol class="board">';
  b.slice(0,limit||10).forEach(function(e,i){
    var ok=e.manual&&chk(e.n,e.s)===String(e.c||"").toUpperCase();
    h+='<li><span class="pos">'+(i+1)+'º</span><span>'+esc(e.n)+'</span><span class="pts">'+e.s+' pts</span>'+
       (e.manual?'<span class="chk '+(e.c?(ok?"ok":"bad"):"")+'">'+(e.c?(ok?"código confere":"código não confere"):"pelo chat")+' <button class="btn small" data-act="delb" data-n="'+esc(e.n)+'" aria-label="Remover '+esc(e.n)+'">×</button></span>':'<span class="chk ok">ao vivo</span>')+'</li>';
  });
  return h+'</ol>';
}
function boardForm(){
  return '<form class="addrow" id="bform"><div class="field"><label class="eyebrow" for="bn">Nome</label><input id="bn" autocomplete="off"></div>'+
    '<div class="field"><label class="eyebrow" for="bs">Pontos</label><input id="bs" inputmode="numeric" autocomplete="off"></div>'+
    '<div class="field"><label class="eyebrow" for="bc">Código</label><input id="bc" maxlength="2" autocomplete="off"></div>'+
    '<button class="btn" type="submit">Lançar</button></form>';
}
function duelResult(i,st){
  var d=H.duel[i]||{},t=tally(F3[i].id),a1=t.p1!=null?t.p1:d.a1,a2=t.p2!=null?t.p2:d.a2,h="";
  function has(v){return !(v===""||v==null||isNaN(v));}
  function bar(lab,v,n){if(!has(v))return '<div><p class="eyebrow">'+lab+'</p><p class="muted">'+(LIVE?"Sem votos.":"Lance o resultado da enquete.")+'</p></div>';
    v=Math.max(0,Math.min(100,Number(v)));
    return '<div><p class="eyebrow">'+lab+(n?" · "+n+(n===1?" voto":" votos"):"")+'</p><div class="bar"><i style="width:'+v+'%"></i></div><div class="barlab"><span>A '+v+'%</span><span>B '+(100-v)+'%</span></div></div>';}
  if(st==="cena")return LIVE?'<p class="lead mono">'+t.n1+" de "+nPlayers()+' votaram</p>':"";
  if(st==="fala")return LIVE?'<div class="votes">'+bar("Antes do duelo",a1,t.n1)+'<div><p class="eyebrow">Depois do duelo</p><p class="lead mono">'+t.n2+" de "+nPlayers()+' votaram</p></div></div>':"";
  h+='<div class="votes">'+bar("Antes do duelo",a1,t.n1)+bar("Depois do duelo",a2,t.n2)+'</div>';
  if(has(a1)&&has(a2)){var dv=Number(a2)-Number(a1);h+='<p class="swing">'+(dv===0?"Ninguém mudou de lado.":"O lado "+(dv>0?"A":"B")+" virou "+Math.abs(dv)+" pontos percentuais.")+'</p>';}
  return h;
}

    left='<p class="eyebrow">'+(fin?"Fechamento · minutos 45 a 50":"Placar das fases 1 e 2")+'</p><h1 class="big">'+(fin?"O que eu mudo na segunda-feira?":"Quem está na frente?")+'</h1>';
    if(fin){left+='<p class="lead">Escreva no chat uma conduta que você vai mudar a partir desta semana.</p><ol class="takes">'+TAKES.map(function(t){return "<li>"+esc(t)+"</li>";}).join("")+'</ol>';}
    else{left+='<p class="lead">'+(LIVE?"O placar se atualiza sozinho. Quem jogou sem conexão digita o código ao lado, copia a linha que aparece e envia no chat.":"Digite o código abaixo no celular para ver sua pontuação. Depois copie a linha que aparece e envie no chat.")+'</p>';}
    right=(fin?"":codeBox(FINAL_CODE))+'<div class="panel"><p class="eyebrow">Placar</p><div id="board">'+boardHtml(fin?8:6)+'</div></div>'+boardForm();
  }
  var dots="";STEPS.forEach(function(x,i){dots+='<i class="'+(x.t==="fase"?"ph ":"")+(i<=H.idx?"on":"")+'"></i>';});
  app.innerHTML='<div class="host"><div class="topbar"><span class="brand">APS 2026</span><span class="eyebrow">'+esc(PLAN[planOf(s)].n)+' · previsto até o minuto '+PLAN[planOf(s)].end+'</span>'+
    '<span class="grow"></span>'+(LIVE?'<span class="eyebrow" id="hnet">'+esc(netLabel())+'</span>':'')+'<span class="clock">Relógio <b id="hclock">--:--</b> / 50:00</span></div>'+
    '<div class="stage'+(one?" one":"")+'"><div class="col">'+left+'</div>'+(one?"":'<div class="col">'+right+'</div>')+'</div>'+
    '<div class="ctrl"><button class="btn" data-act="prev"'+(H.idx===0?" disabled":"")+'>← Voltar</button><button class="btn primary" data-act="next"'+(H.idx===STEPS.length-1?" disabled":"")+'>Avançar →</button>'+
    '<div class="dots" aria-hidden="true">'+dots+'</div><span class="grow"></span><span class="muted">Setas do teclado também avançam</span>'+
    '<a class="btn small" href="#jogar">Ver a tela do médico</a><button class="btn small" data-act="hreset">Zerar painel</button></div></div>';
  if(s.t==="capa")drawQR();
  tickHost();
  hostNet();bcast();
}
function drawQR(){
  var el=document.getElementById("qr");if(!el)return;
  if(!H.link){el.innerHTML='<span class="mono" style="font-size:.75rem;text-align:center">Sem endereço público ainda</span>';return;}
  if(typeof qrcode==="undefined"){el.innerHTML='<span class="mono" style="font-size:.75rem;text-align:center">QR code indisponível: use o link ao lado</span>';return;}
  try{var q=qrcode(0,"M");q.addData(H.link);q.make();
    try{el.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});}catch(e){el.innerHTML=q.createImgTag(4,0);}
  }catch(e){el.textContent="QR";}
}
function tickHost(){
  if(route()!=="painel")return;
  var c=document.getElementById("hclock");if(c)c.textContent=H.start?mmss((Date.now()-H.start)/1000):"00:00";
  var t=document.getElementById("htimer");
  if(t){ if(H.timer){var l=(H.timer.end-Date.now())/1000;t.textContent=l<=0?"Tempo!":mmss(l);t.className="timer"+(l<=0?" end":"");}else{t.textContent="00:45";t.className="timer";} }
}

/* ================= ROTAS E EVENTOS ================= */
function route(){return (location.hash||"").replace("#","")==="painel"?"painel":"jogar";}
function render(){if(route()==="painel")renderHost();else renderPlayer();}

app.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act"),v=b.getAttribute("data-v");
  if(a==="join"){var n=(document.getElementById("pname").value||"").trim();if(!n)return;
    var rm=document.getElementById("proom");if(rm){var rv=rm.value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(rv.length===4&&rv!==P.room){P.room=rv;P.ans={};P.rev={};P.votes={};}}
    P.name=n;P.view="wait";P.err="";psave();render();}
  else if(a==="vote"){var lv=PN.live;if(!lv||lv.view!=="vote")return;(P.votes[lv.d]||(P.votes[lv.d]={}))[lv.r]=v;psave();psend({t:"vote",d:lv.d,r:lv.r,s:v});render();}
  else if(a==="code"){openCode((document.getElementById("code").value||"").trim());}
  else if(a==="sel"){if(!P.cur)return;var it=STEP[P.cur.id];P.sel=it.kind==="vf"?(v==="1"):Number(v);render();}
  else if(a==="bet"){P.bet=Number(v);render();}
  else if(a==="lock"){lockQ(false);}
  else if(a==="cont"){if(P.next==="final"){P.view="final";}else{startQ(P.next);}psave();render();}
  else if(a==="copy"){var line=document.getElementById("finalline").textContent,msg=document.getElementById("copymsg");
    try{navigator.clipboard.writeText(line).then(function(){msg.textContent="Copiado. Cole no chat da sala.";},function(){msg.textContent="Selecione a linha acima e copie.";});}catch(e){msg.textContent="Selecione a linha acima e copie.";}}
  else if(a==="reset"){if(b.getAttribute("data-sure")){pstop();P={name:"",ans:{},rev:{},cur:null,view:"join",sel:null,bet:1,queue:[],next:null,err:"",room:P.room,pid:P.pid,votes:{}};psave();render();}else{b.setAttribute("data-sure","1");b.textContent="Toque de novo para apagar seus pontos";}}
  else if(a==="next"){go(1);} else if(a==="prev"){go(-1);}
  else if(a==="start"){H.start=Date.now();hsave();go(1);}
  else if(a==="t+"){if(H.timer){H.timer.end=Math.max(H.timer.end,Date.now())+15000;hsave();tickHost();bcast();}}
  else if(a==="t0"){var s=STEPS[H.idx];setTimer(s.secs||45,"");}
  else if(a==="ta"){setTimer(45,"Lado A falando");} else if(a==="tb"){setTimer(45,"Lado B falando");}
  else if(a==="delb"){var nm=b.getAttribute("data-n");H.board=H.board.filter(function(e){return e.n!==nm;});hsave();render();}
  else if(a==="hreset"){if(b.getAttribute("data-sure")){var nr=newRoom(),ol=H.link;Object.keys(HN.conns).forEach(function(k){try{HN.conns[k].send({t:"reset",room:nr});}catch(e){}});
      H={idx:0,start:null,link:"",board:[],duel:{},timer:null,players:{},done:{},room:nr};H.link=defaultLink()||ol;hsave();
      setTimeout(function(){try{if(HN.peer)HN.peer.destroy();}catch(e){}HN.peer=null;HN.ok=false;HN.conns={};render();},500);}else{b.setAttribute("data-sure","1");b.textContent="Clique de novo para zerar";}}
});
app.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="code"){t.value=t.value.replace(/\D/g,"");if(t.value.length===2)openCode(t.value);}
  else if(t.id==="hlink"){H.link=t.value.trim().replace(/#painel$/,"")||defaultLink();hsave();var lt=document.getElementById("linktext");if(lt)lt.textContent=H.link||"O jogo precisa estar hospedado em um endereço público para os médicos entrarem.";drawQR();}
  else if(t.id==="a1"||t.id==="a2"){var s=STEPS[H.idx];if(s.t!=="duelo")return;var d=H.duel[s.i]||(H.duel[s.i]={});var val=t.value.replace(/[^\d]/g,"");d[t.id]=val===""?"":Math.min(100,Number(val));hsave();var r=document.getElementById("duelres");if(r)r.innerHTML=duelResult(s.i,s.st);}
});
app.addEventListener("submit",function(ev){
  ev.preventDefault();
  if(ev.target.id!=="bform")return;
  var n=norm(document.getElementById("bn").value),sv=document.getElementById("bs").value.replace(/[^\d-]/g,""),c=(document.getElementById("bc").value||"").trim().toUpperCase();
  if(!n||sv===""||isNaN(Number(sv)))return;
  H.board=H.board.filter(function(e){return e.n!==n;});H.board.push({n:n,s:Number(sv),c:c});hsave();render();
  var f=document.getElementById("bn");if(f)f.focus();
});
app.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id==="pname"){ev.preventDefault();var j=app.querySelector('[data-act="join"]');if(j)j.click();}
});
document.addEventListener("keydown",function(ev){
  if(route()!=="painel")return;var tg=ev.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA")return;
  if(ev.key==="ArrowRight"||ev.key==="PageDown"){ev.preventDefault();go(1);} else if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ev.preventDefault();go(-1);}
});
window.addEventListener("hashchange",render);
var tickN=0;
setInterval(function(){tickN++;if(route()==="painel"){tickHost();if(tickN%16===0)bcast();}else tickPlayer();},250);

try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){window.claude.hot.snapshot(function(){return {player:P,host:H};});}}catch(e){}
if(P.view==="question"&&!P.cur)P.view="wait";
render();
})();
</script>
